server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- LOAD DYNAMIC VARIABLES ---
  # 1. Include the file created by entrypoint.sh
  #    This file contains: set $CORS_ORIGIN "https://your-domain.com";
  include /etc/nginx/conf.d/cors_env.txt;

  # 2. Set the internal Nginx variable using your specific Doppler variable name
  #    CHANGED: Now using "$CORS_ORIGIN" instead of "$CORS_ALLOWED_ORIGIN"
  set $cors_origin "$CORS_ORIGIN";
  
  # Default to 'null' if the variable is empty
  if ($cors_origin = "") {
      set $cors_origin "null";
  }

  # --- API: proxy to FastAPI (must be before location /)
  # Without this, /api/* is handled by try_files → GET returns index.html, POST returns 405.
  # Upstream is injected at container start from VITE_API_BASE_URL (see entrypoint.sh).
  location /api/ {
    proxy_pass __API_PROXY_PASS__;
    proxy_http_version 1.1;
    # When proxying to an external HTTPS upstream, use upstream host for routing/SNI.
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_set_header User $http_user;
    proxy_set_header Cookie $http_cookie;

    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PATCH, PUT, DELETE' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-CSRF-Token' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    client_max_body_size 50m;
    proxy_read_timeout 120s;
  }

  # --- HANDLE OAUTH CALLBACK ---
  # Explicitly handle the callback route to ensure POST requests work
  # and fallback to index.html for React Router to process
  # location /oauth2/idpresponse 
  # {
  # try_files $uri /index.html;
  # }

  # --- MAIN SPA ROUTING ---
  location / {
    # --- APPLY CORS HEADERS ---
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    try_files $uri /index.html;
  }

  # --- STATIC ASSETS CACHING ---
  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg)$ {
    expires 30d;
    add_header Cache-Control "public, no-transform";
  }
}