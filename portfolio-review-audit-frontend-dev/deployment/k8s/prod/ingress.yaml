apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pr-audit-ui-ingress
  namespace: pr-audit
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    # IP allowlist (S3): corporate CIDR + consultant egress ranges.
    # 14.97.160.250/32 and 20.204.154.0/24 cover external consultant egress (split-tunnel: app traffic does not use the corporate range).
    alb.ingress.kubernetes.io/inbound-cidrs: 163.116.128.0/17,20.204.154.0/24,14.97.160.250/32
    alb.ingress.kubernetes.io/target-type: ip
    # WAF associated declaratively so the LB Controller does not revert console-attached ACLs on deploy.
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:105849548382:regional/webacl/sc-insea-prod-web-acl/941cf9e8-f54f-45ff-b437-97d0e2b67a24
    # Access logs set declaratively so the LB Controller does not revert console-enabled logging on deploy.
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=aws-alb-logs-insea-prod,access_logs.s3.prefix=alblogs/k8s-praudit-prauditu-1e59723372
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:105849548382:certificate/279a344e-798a-4128-b1cf-c0ed2920bd36
    alb.ingress.kubernetes.io/subnets: subnet-0f379d1bd5a6748fc,subnet-06bae993d459ee575
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  rules:
    - host: pr-audit.peakxv.app
      http:
        paths:
          - backend:
              service:
                name: pr-audit-ui-service
                port:
                  number: 80
            path: /
            pathType: Prefix