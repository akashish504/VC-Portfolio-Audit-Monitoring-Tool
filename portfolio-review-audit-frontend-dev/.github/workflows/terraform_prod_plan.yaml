name: Terraform Prod Plan

on:
  pull_request:
    branches: [dev]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform_prod_plan.yaml'

permissions:
  id-token: write
  contents: read

jobs:
  plan-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (prod read-only/plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-1
          role-to-assume: ${{ secrets.TERRAFORM_PROD_PLAN_ROLE_ARN }}
          role-session-name: TerraformProdPlan

      - name: Terraform Init
        working-directory: infra/terraform/k8s-app
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra/terraform/k8s-app
        run: terraform validate

      - name: Terraform Plan (no backend, prod vars)
        working-directory: infra/terraform/k8s-app
        run: terraform plan -input=false -lock=false -var-file=environments/prod.tfvars
