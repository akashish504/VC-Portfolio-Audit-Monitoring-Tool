version: '3.8'

services:
  app:
    container_name: fastapi-app
    image: ashishtailoredai/peakxv-pr-tool:latest
    expose:
      - "8000"
    environment:
      - ENV=production
      - DEBUG=false
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tailoredAI}
      - POSTGRES_HOST=${POSTGRES_HOST:-peakxv-test-db.cxok8ouastuu.eu-north-1.rds.amazonaws.com}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-peakxv_pr_tool}
    restart: always

  nginx:
    container_name: nginx
    image: nginx:1.25
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    restart: always 